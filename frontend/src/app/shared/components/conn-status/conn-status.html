@if (mode === 'chip') {
  <span class="bs-conn" [class]="'bs-conn--' + state">
    <span class="bs-conn__dot"></span>
    {{ label }}
  </span>
} @else if (state !== 'online') {
  <div class="bs-conn-banner" [class]="'bs-conn-banner--' + state">
    @if (state === 'sync') {
      <span class="spinner"></span>
    }
    {{ message }}
  </div>
}
