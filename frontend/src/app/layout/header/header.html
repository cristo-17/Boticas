<div class="app-header">
  <div class="app-header__brand">
    <img src="/logo.png" alt="BoticaSys Logo" class="app-header__logo-img" />
    <div class="app-header__texto">
      <div class="app-header__name">BoticaSys</div>
      <div class="app-header__sede" [attr.title]="sede()">{{ sede() }}</div>
    </div>
  </div>

  <app-header-notificaciones></app-header-notificaciones>

  <!-- Tarea 22: estado real de la conexión y la cola de ventas sin enviar (reemplaza el botón de demostración). -->
  <app-header-cola></app-header-cola>

  <app-button variant="secondary" class="app-header__salir-texto" (clicked)="cerrarSesion()">Salir</app-button>
  <app-button variant="secondary" class="app-header__salir-icono" [icon]="true" ariaLabel="Salir" (clicked)="cerrarSesion()">
    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
  </app-button>
</div>
