# BE-005 (docs/BITACORA.md): perfil "test" -- activado por
# maven-surefire-plugin (spring.profiles.active, pom.xml) en TODO
# ./mvnw test. Es un archivo de PERFIL (application-test.properties),
# no application.properties a secas: se fusiona sobre la base
# (src/main/resources/application.properties), no la reemplaza -- CORS,
# zona horaria, IGV, etc. siguen viniendo de ahi.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/botica_test
spring.flyway.clean-disabled=false

# Secreto de JWT fijo para que los tests de AuthService/JwtUtil sean
# deterministas -- no depende de una variable de entorno que puede o
# no estar seteada en la maquina de quien corre "./mvnw test".
app.jwt.secret=secreto-fijo-de-test-nunca-usar-fuera-de-la-suite-1234567890
