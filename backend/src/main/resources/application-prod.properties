# Perfil de despliegue real (Tarea 10, docs/DESPLIEGUE.md). Se activa
# con SPRING_PROFILES_ACTIVE=prod. Reemplaza el seed de desarrollo
# (30 productos, 90 lotes de muestra) por un arranque minimo real:
# 1 botica y 1 usuario ADMINISTRADOR, sin ningun dato de demostracion.
spring.flyway.locations=classpath:db/migration,classpath:db/seed/prod

# Neon exige SSL en el servidor (verificado en su documentacion, no
# asumido) -- sslmode=require solo aqui, nunca en application.properties
# base: Postgres local de desarrollo no tiene SSL configurado.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require

# Valores reales inyectados por variable de entorno -- nunca hardcodeados
# ni en este archivo ni en la migracion. adminPasswordHash es el hash
# BCrypt ya calculado (nunca la contrasena en texto plano) -- generarlo
# una sola vez localmente con BCryptPasswordEncoder y pegar el hash
# (no la contrasena) en el panel de Render, jamas en el repo.
spring.flyway.placeholders.boticaNombre=${BOTICA_NOMBRE}
spring.flyway.placeholders.adminNombre=${ADMIN_NOMBRE}
spring.flyway.placeholders.adminUsuario=${ADMIN_USUARIO}
spring.flyway.placeholders.adminPasswordHash=${ADMIN_PASSWORD_HASH}
spring.flyway.placeholders.adminTurno=${ADMIN_TURNO}
