spring.application.name=backend

# Conexion a botica_db. Sin credenciales por defecto: se leen de variables
# de entorno (o de un application-local.properties fuera de git) para no
# dejar nada de desarrollo local commiteado.
# En Neon (Tarea 10, docs/DESPLIEGUE.md): usar el endpoint DIRECTO
# (sin "-pooler" en el host), tanto aqui como en Flyway. El pooler de
# Neon (PgBouncer modo transaccion) no garantiza que el SET TIME ZONE
# de abajo sobreviva entre transacciones.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:botica_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
# db/migration = esquema (V1, comun a todo entorno, sin subcarpetas
# para que el escaneo recursivo de Flyway no choque con db/seed).
# db/seed/dev = seed de desarrollo con datos de demostracion (30
# productos, 90 lotes). El perfil prod (application-prod.properties,
# Tarea 10) usa en su lugar db/seed/prod, sin ningun dato de muestra.
spring.flyway.locations=classpath:db/migration,classpath:db/seed/dev

# Zona horaria explicita (Regla 5, docs/CLAUDE.md; pendiente anotado en
# docs/DECISIONES.md al pasar el esquema a TIMESTAMPTZ en la Tarea 7).
# TIMESTAMPTZ ya hace que el INSTANTE guardado sea inequivoco, pero la
# SESION que abre cada conexion JDBC igual necesita su propia zona fija:
# sin esto, funciones de fecha usadas dentro de una consulta (p.ej.
# CURRENT_DATE) o la conversion de vuelta a texto/LocalDate en el driver
# seguirian dependiendo de en que zona corre el proceso del backend. Se
# fija en la conexion (no solo en el JVM) para que "la caja de hoy" sea
# la fecha de Lima sin importar donde se despliegue el servidor (Tarea 10
# lo va a correr en UTC).
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Lima'
spring.jackson.time-zone=America/Lima
# Jackson 3.x (este Spring Boot) movio WRITE_DATES_AS_TIMESTAMPS de
# SerializationFeature a DateTimeFeature, expuesto bajo datatype.datetime
# -- no bajo serialization como en Jackson 2.x. La clave es el nombre
# EXACTO del enum: el binder relajado (kebab-case) no aplica a claves de
# Map<Enum,Boolean>.
spring.jackson.datatype.datetime.WRITE_DATES_AS_TIMESTAMPS=false

# CORS (Tarea 8): origen del frontend por variable de entorno, nunca
# hardcodeado -- en despliegue (Tarea 10) el frontend vive en otra URL.
app.cors.origen=${CORS_ORIGEN:http://localhost:4200}

# Config de negocio (GET /api/config, Tarea 8). Ajustar un umbral es
# cambiar un valor aqui, no recompilar Java -- ver config/ConfigNegocioProperties.
app.config-negocio.igv=0.18
app.config-negocio.umbral-stock-bajo=15
app.config-negocio.descuadre-leve=10.00
app.config-negocio.vencimiento-critico-dias=30
app.config-negocio.vencimiento-advertencia-dias=90
